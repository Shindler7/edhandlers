# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".git-rewrite",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    "venv",
    ".vscode",
    "__pypackages__",
    "build",
    "dist",
    "docs/_build",
    "*.egg-info",
]

# Same as Black.
line-length = 88
indent-width = 4

# Включенный по умолчанию режим --fix.
fix = true

# Assume Python 3.10+
target-version = "py312"

[lint]
select = [
    "E", "W",
    # Нарушения, которые точно приведут к ошибкам (Pyflakes).
    "F",
    # Проверка аннотаций типов (строгость как в Rust).
    "ANN",
    # Поиск неиспользуемых аргументов (как в Rust: fn foo(_x: i32)).
    "ARG",
    # Обновление кода до актуальной версии Python (pyupgrade).
    "UP",
    # Нахождение скрытых багов (flake8-bugbear).
    "B",
    # Упрощение кода (flake8-simplify).
    "SIM",
    # Автоматическая сортировка импортов (как cargo fmt).
    "I",
    # Контроль кавычек (чтобы линтер дружил с одинарными кавычками).
    "Q",
]

ignore = [
    # Разрешить использовать Any, если это действительно нужно.
    "ANN401",
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.flake8-quotes]
inline-quotes = "single"

[format]
# Like Black, use double quotes for strings.
quote-style = "single"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "RUF012"]
